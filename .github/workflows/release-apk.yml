name: Release APK

on:
  push:
    tags:
      # Semver only — never date-based tags (e.g. v20260928).
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches app version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          EXPECTED="v${VERSION_NAME}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match app/build.gradle.kts versionName ($VERSION_NAME). Expected tag $EXPECTED."
            exit 1
          fi
          echo "Tag $TAG matches versionName $VERSION_NAME"

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing."
            echo "Create GitHub Actions secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (optional: ANDROID_KEY_PASSWORD)."
            echo "See README §「Release 签名与 GitHub Secrets」 for keystore generation. Refusing to publish an unsigned/debug APK."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKM="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "sdkmanager=${SDKM}"
          yes | "${SDKM}" --licenses >/dev/null || true
          "${SDKM}" "platforms;android-35" "build-tools;35.0.0"

      - name: Install release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"

      - name: Read versionName
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "versionName=${VERSION_NAME}"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release asset
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          APK_NAME="C一周通-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          ls -la "${APK_NAME}"

      - name: Write release notes
        run: |
          {
            echo "## 更新 Highlights"
            echo
            sed -n '/^## 功能 Features$/,/^---$/p' README.md | sed '1d;$d'
            echo
            echo "---"
            echo
            echo "Release 包 \`assembleRelease\`，applicationId \`com.py2c.week\`，由 CI 使用仓库 Secrets 中的发布 keystore 签名。"
          } > release_body.md

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: C一周通 ${{ steps.version.outputs.name }}
          body_path: release_body.md
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true

      - name: Manual run note
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch 仅验证构建与签名，不会创建 GitHub Release。请推送 semver 标签 vX.Y.Z 以发布。"
